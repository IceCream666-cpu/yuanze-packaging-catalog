w','ready'],to:'pending',roles:['sales','manager'],title:'发起下一轮调整'}};
function transition(record,action,payload={},role='sales'){
 const r=rules[action];if(!r||!r.from.includes(record.status))throw new Error('当前状态不能进行此操作');if(!r.roles.includes(role))throw new Error('请切换到对应岗位的演示视角');
 if(['reject','adjust','complete','confirm'].includes(action)&&!String(payload.note||'').trim())throw new Error('请填写处理意见');
 if(action==='ship'&&(!String(payload.carrier||'').trim()||!String(payload.tracking||'').trim()))throw new Error('请填写模拟快递名称及单号');

 if(action==='adjust'&&!/^\d{4}-\d{2}-\d{2}$/.test(payload.due||''))throw new Error('请填写下一轮期望完成日期');

function formulaPage(){let a=list();return `${titleBlock('配方与版本','FORMULA LIBRARY','配方引用、制作轮次与客户确认分别追溯')}<div class="note" style="margin-bottom:20px">本页仅使用虚构配方示意。岗位切换用于体验界面，不代表真实系统的访问控制。</div>${state.role==='sales'?`<div class="panel"><div class="lock-panel">${icon('lock')}<div><h2>完整配方仅向授权研发岗位展示</h2><p class="subtext">业务员可查看进度与版本编号。这里演示按岗位展示不同内容。</p><button class="link-btn" data-role="lab">切换实验室演示视角 →</button></div></div></div>`:''}<section class="panel"><div class="panel-title"><h2>配方版本索引</h2><span class="small muted">全部为演示编号</span></div><div class="table-wrap"><table><thead><tr><th>产品</th><th>当前配方引用</th><th>打样轮次</th><th>关联状态</th><th>操作</th></tr></thead><tbody>${a.map(s=>`<tr><td class="product-title">${esc(s.name)}</td><td>${esc(s.versions.at(-1).code)}</td><td>第${s.round}轮</td><td>${badge(s.status)}</td><td><button class="link-btn" data-formula="${s.id}">${state.role==='sales'?'查看关联样品':'查看配方示意'}</button></td></tr>`).join('')}</tbody></table></div></section>`}
const money=(v,c='CNY')=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:c,maximumFractionDigits:2}).format(v);
function genericTable(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||'<tr><td colspan="8"><div class="empty">当前业务板块暂无记录</div></td></tr>'}</tbody></table></div>`}
function orderPage(){let a=records.orders.filter(v=>v.market===state.market);return `${titleBlock('大货订单','SALES ORDERS','从确认样品衔接采购、生产与出货','<button class="btn primary" data-action="choose-confirmed">＋ 从确认样品创建</button>')}<section class="panel">${genericTable(['订单 / 产品','客户','数量','订单金额','已收款','状态','交期','操作'],a.map(v=>`<tr><td><b class="product-title">${esc(v.name)}</b><div class="cell-sub">${v.id}</div></td><td>${esc(v.client)}</td><td>${v.qty.toLocaleString()} 件</td><td>${money(v.total,v.currency)}</td><td>${money(v.paid,v.currency)}</td><td><span class="badge blue">${v.status}</span></td><td>${v.due}</td><td><button class="link-btn" data-record="orders:${v.id}">查看 →</button></td></tr>`))}</section><div class="note">大货创建时保留确认样品及配方引用快照。后续样品调整不会自动改变订单版本。</div>`}
function procurementPage(){let a=records.procurement.filter(v=>v.market===state.market);return `${titleBlock('采购与生产','PROCUREMENT & PRODUCTION','查看供应、制作节点和承诺交期')}<section class="panel">${genericTable(['任务 / 单号','关联订单','执行方','计划数量','当前节点','预计交期','操作'],a.map(v=>`<tr><td><b class="product-title">${esc(v.name)}</b><div class="cell-sub">${v.id}</div></td><td>${v.order}</td><td>${esc(v.owner)}</td><td>${v.qty.toLocaleString()}</td><td><span class="badge ${v.status==='已完成'?'green':'orange'}">${v.status}</span></td><td>${v.due}</td><td><button class="link-btn" data-record="procurement:${v.id}">更新进度 →</button></td></tr>`))}</section><div class="note">节点更新为演示记录，不向工厂或供应商发送信息。完成生产后可在品质与仓库查看关联批次。</div>`}
function warehousePage(){let a=records.warehouse.filter(v=>v.market===state.market);return `${titleBlock('品质与仓库','QUALITY & WAREHOUSE','检验、入库和发货按批次关联')}<section class="panel">${genericTable(['产品 / 批次','关联订单','数量','仓位','当前状态','操作'],a.map(v=>`<tr><td><b class="product-title">${esc(v.name)}</b><div class="cell-sub">${v.id}</div></td><td>${v.order}</td><td>${v.qty} ${v.unit}</td><td>${esc(v.location)}</td><td><span class="badge ${v.status==='待检验'?'orange':'green'}">${v.status}</span></td><td><button class="link-btn" data-record="warehouse:${v.id}">查看与处理 →</button></td></tr>`))}</section><div class="note">演示顺序：待检验 → 已检验 → 已入库 → 已出库。未通过检验不能直接登记出库。</div>`}
function financePage(){let a=records.orders.filter(v=>v.market===state.market);return `${titleBlock('财务记录','RECEIVABLES','关联业务订单，分别记录各币种收款')}<section class="panel">${genericTable(['关联订单 / 客户','币种','应收金额','已收金额','待收金额','状态','操作'],a.map(v=>`<tr><td><b class="product-title">${v.id}</b><div class="cell-sub">${esc(v.client)}</div></td><td>${v.currency}</td><td>${money(v.total,v.currency)}</td><td>${money(v.paid,v.currency)}</td><td>${money(v.total-v.paid,v.currency)}</td><td><span class="badge ${v.paid>=v.total?'green':'orange'}">${v.paid>=v.total?'已收齐':'部分收款'}</span></td><td><button class="link-btn" data-payment="${v.id}" ${v.paid>=v.total?'disabled':''}>登记模拟回款</button></td></tr>`))}</section><section class="panel"><div class="panel-title"><h2>本次演示新增回款</h2></div>${payments.filter(p=>a.some(v=>v.id===p.order)).map(p=>`<div class="compact-row"><div class="grow">${p.order}<div class="cell-sub">${esc(p.note)}</div></div><b>${money(p.amount,p.currency)}</b></div>`).join('')||'<div class="empty">暂无新增记录，可从订单登记一笔模拟回款。</div>'}</section>`}
function clientsPage(){return `${titleBlock('客户资料','CUSTOMERS','客户、负责人和关联业务集中查看')}<section class="panel">${genericTable(['客户','业务板块','负责人','关联样品','当前进度','操作'],list().map(s=>`<tr><td class="product-title">${esc(s.client.split(' · ')[0])}<div class="cell-sub">虚构客户资料</div></td><td>${s.market==='domestic'?'国内':'国外'}</td><td>${esc(s.owner)}</td><td>${s.id}</td><td>${badge(s.status)}</td><td><button class="link-btn" data-open="${s.id}">查看关联样品 →</button></td></tr>`))}</section>`}
function reportsPage(){let a=list();let sum=a.reduce((n,s)=>n+s.round,0);return `${titleBlock('业务报表','BUSINESS INSIGHTS','根据当前演示数据实时汇总')}${metrics()}<div class="lower-grid"><section class="panel"><div class="panel-title"><h2>样品阶段分布</h2><span class="small muted">单位：主单</span></div><div class="panel-body">${Object.entries(labels).map(([k,v])=>{let n=a.filter(s=>s.status===k).length;return `<div class="bar-row"><span>${v}</span><div class="bar-track"><div class="bar-fill" style="width:${n/(a.length||1)*100}%"></div></div><b>${n}</b></div>`}).join('')}</div></section><section class="panel"><div class="panel-title"><h2>打样轮次</h2></div><div class="panel-body"><div class="metric-value">${(sum/(a.length||1)).toFixed(1)}<small>平均轮次</small></div><p class="subtext">口径：当前主单轮次合计 ÷ 当前板块样品主单数。内部返工沿用原轮次。</p>${[1,2,3].map(n=>`<div class="bar-row"><span>${n===3?'3轮及以上':n+'轮'}</span><div class="bar-track"><div class="bar-fill" style="background:#26a58a;width:${a.filter(s=>n===3?s.round>=3:s.round===n).length/(a.length||1)*100}%"></div></div><b>${a.filter(s=>n===3?s.round>=3:s.round===n).length}</b></div>`).join('')}<div class="note">该统计口径用于参考。正式业务中内部返工如何计轮次仍需确认。</div></div></section></div>`}
function settingsPage(){return `${titleBlock('系统设置','WORKSPACE SETTINGS','当前参考系统使用的演示规则')}<section class="panel"><div class="panel-title"><h2>演示配置与使用范围</h2></div><div class="panel-body">${[['业务板块','国内、国外共享样品流程，按顶部入口筛选。'],['岗位视角','业务员、实验室、管理者可切换；仅演示界面和动作分工。'],['返工与轮次','内部退回沿用轮次；客户反馈后发起调整则新增一轮，正式规则待确认。'],['数据保存','仅本次页面内存，刷新即恢复初始虚构数据。不会上传输入内容。'],['真实系统边界','尚未连接生产数据库、真实账号权限、文件上传、财务或物流服务。']].map(([k,v])=>`<div class="settings-row"><div><strong>${k}</strong><p>${v}</p></div><span class="badge">参考规则</span></div>`).join('')}<div class="actions" style="margin-top:24px"><button class="btn" data-action="reset">重置本次演示</button><button class="btn primary" data-action="about">查看建议体验顺序</button></div></div></section>`}
function render(){document.getElementById('nav').innerHTML=nav.map(([k,t,i],n)=>`${n===1?'<div class="nav-section">业务协同</div>':n===8?'<div class="nav-section">经营管理</div>':''}<button class="nav-item ${state.page===k?'active':''}" data-page="${k}">${icon(i)}${t}${k==='samples'?'<span class="nav-count">'+list().length+'</span>':''}</button>`).join('');document.getElementById('crumb').textContent=nav.find(n=>n[0]===state.page)?.[1]||'样品中心';document.querySelectorAll('[data-market]').forEach(el=>el.classList.toggle('active',el.dataset.market===state.market));document.getElementById('role').value=state.role;const pages={home:homePage,samples:samplePage,lab:labPage,formulas:formulaPage,orders:orderPage,procurement:procurementPage,warehouse:warehousePage,finance:financePage,clients:clientsPage,reports:reportsPage,settings:settingsPage};document.getElementById('main').innerHTML=state.detail&&current()?detailPage(current()):(pages[state.page]||samplePage)();}
function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.remove('show'),3500)}
function openModal(title,body,form='',buttons=''){const d=document.getElementById('modal');document.getElementById('modalContent').innerHTML=`${form?`<form id="${form}">`:''}<div class="modal-head"><h2>${title}</h2><button type="button" class="icon-btn" data-close aria-label="关闭对话框">×</button></div><div class="modal-body">${body}</div>${buttons?`<div class="modal-footer"><button type="button" class="btn" data-close>取消</button>${buttons}</div>`:''}${form?'</form>':''}`;if(!d.open)d.showModal()}
function closeModal(){document.getElementById('modal').close()}
function about(){openModal('欢迎体验源泽参考系统',`<p class="subtext">这是供讨论流程与界面的可点击原型，所有客户、订单和配方均为虚构演示。</p><ol class="check-list"><li>在样品中心打开“轻盈保湿面霜”，体验审核通过或退回。</li><li>切换“实验室视角”，接单制作并提交新结果。</li><li>回到“业务员视角”，审核、登记模拟寄样，记录客户确认或新一轮调整。</li><li>客户确认后关联大货，再查看采购生产、品质仓库与回款。</li><li>切换国内／国外板块，查看独立业务记录。</li></ol><div class="note">当前数据只在本次页面有效，刷新后重置。岗位切换不是正式登录或安全权限；不要填写真实配方、客户隐私或财务数据。</div>`, '', '<button type="button" class="btn primary" data-close>开始体验</button>')}
function newSample(){openModal('新建样品单',`<div class="note" style="margin-bottom:20px">${state.market==='domestic'?'国内':'国外'}业务 · 先填写客户需求，实验室随后补充制作记录。</div><div class="form-grid">${field('客户名称','client')}${field('产品名称','name')}${selectfield('打样目的','type',['新配方','来样仿样','配方调整','已有配方复样','包材打样'])}${field('业务员','owner','text','林悦')}${field('期望完成日期','due','date','2026-09-29')}${field('参考样 / 基础配方编号','base','text','',false)}${field('寄样份数','quantity','number',5)}${field('每份装量（g，演示口径）','fill','number',30)}${field('留样份数（演示口径）','retained','number',3)}${selectfield('样品容器','container',['实验室样品瓶','客户提供的容器','软管','膜袋'])}${field('目标成本及口径（选填）','cost','text','',false,true)}${textfield('料体要求 / 本次调整目标','req')}</div>`,'newForm','<button class="btn" type="submit" name="mode" value="draft">保存草稿</button><button class="btn primary" type="submit" name="mode" value="submit">提交实验室</button>')}
function stepModal(action){const s=current();if(!s)return;const r=rules[action];if(!r?.roles.includes(state.role)||!r.from.includes(s.status))return toast('当前状态或演示岗位不支持此操作');if(['start','approve','submit'].includes(action)){performStep(action,{});return}let body=`<div class="note" style="margin-bottom:18px">${esc(s.name)} · ${s.id} · 第${s.round}轮</div><input type="hidden" name="action" value="${action}"><div class="form-grid">`;if(action==='ship')body+=field('模拟快递','carrier','text','演示快递')+field('模拟快递单号','tracking','text','DEMO-'+s.id+'-R'+s.round);else if(action==='complete')body+=field('实际使用的配方版本','formula','text',s.versions.at(-1)?.code==='待实验室确认'?'F-DEMO-'+s.id.slice(-3)+'-V'+s.round:s.versions.at(-1)?.code,true,true)+textfield('制作结果 / 本次版本说明','note','已完成本次制作，提交业务员审核。');else if(action==='adjust')body+=textfield('保留什么、改变什么以及原因','note')+field('下一轮期望完成日期','due','date','2026-09-29');else body+=textfield(action==='reject'?'退回原因与调整要求':'客户确认意见及依据','note');body+='</div>';openModal(r.title,body,'stepForm',`<button class="btn primary" type="submit">${action==='ship'?'保存模拟寄样记录':r.title}</button>`)}
function performStep(action,payload){try{const s=current();const n=transition(s,action,payload,state.role);samples=samples.map(v=>v.id===n.id?n:v);closeModal();render();toast(rules[action].title+'，记录已保留')}catch(e){toast(e.message)}}
function formulaModal(id){let s=samples.find(v=>v.id===id);if(!s)return;if(state.role==='sales'){openSample(id);return}openModal('配方版本示意',`<span class="badge blue">虚构数据 · 不可用于生产</span><h3 style="margin-top:16px">${esc(s.name)} · ${esc(s.versions.at(-1).code)}</h3>${genericTable(['演示原料','示意比例','备注'],[['演示原料 A','60%','仅展示字段结构'],['演示原料 B','25%','仅展示字段结构'],['演示原料 C','15%','仅展示字段结构']].map(v=>'<tr>'+v.map(t=>'<td>'+t+'</td>').join('')+'</tr>'))}<div class="note" style="margin-top:20px">实际配方、原料、工艺和成本需要后续在正式研发模块中录入。这些示意比例没有配方或生产意义。</div>`, '', '<button type="button" class="btn primary" data-close>关闭</button>')}
function openSample(id){let s=samples.find(v=>v.id===id);if(!s)return;state.market=s.market;state.page='samples';state.detail=id;history.replaceState(null,'','#samples');render();window.scrollTo(0,0)}
function recordModal(type,id){let r=records[type]?.find(v=>v.id===id);if(!r)return;let body=`<span class="badge blue">${esc(r.status)}</span><h3 style="margin-top:15px">${esc(r.name)}</h3><div class="info-grid">${[['单号',r.id],['数量',r.qty],['关联',r.order||r.sample],['负责人 / 客户',r.owner||r.client||r.location]].map(([k,v])=>`<div><div class="info-label">${k}</div><div class="info-value">${esc(v)}</div></div>`).join('')}</div>`;let buttons='';if(type==='orders'){body+=`<div class="requirement">确认版本快照：${esc(r.formula)}<br>应收 ${money(r.total,r.currency)} · 已收 ${money(r.paid,r.currency)}</div>`;if(r.status==='待生产')buttons=`<button type="button" class="btn primary" data-create-task="${r.id}">生成模拟生产任务</button>`;else buttons='<button type="button" class="btn primary" data-close>完成查看</button>';}if(type==='procurement'){body+='<p class="subtext" style="margin-top:20px">更新本任务节点，会在完成时创建对应待检批次；不会通知真实工厂。</p>';buttons=`<button type="button" class="btn primary" data-progress="procurement:${r.id}" ${r.status==='已完成'?'disabled':''}>${r.status==='已完成'?'已完成':'推进下一节点'}</button>`;}if(type==='warehouse'){body+='<p class="subtext" style="margin-top:20px">检验、入库和出库分开登记。此操作只更新演示数据。</p>';buttons=`<button type="button" class="btn primary" data-progress="warehouse:${r.id}" ${r.status==='已出库'?'disabled':''}>${({'待检验':'登记检验通过','已检验':'登记入库','已入库':'登记模拟出库','已出库':'已完成出库'})[r.status]}</button>`;}openModal('业务记录详情',body,'',buttons)}
function progressRecord(type,id){let r=records[type]?.find(v=>v.id===id);if(!r)return;if(type==='procurement'){let flow=r.id.startsWith('PO')?['待收货','已完成']:['待开工','配料中','灌装中','包装中','已完成'];let i=flow.indexOf(r.status);if(i<0||i===flow.length-1)return;r.status=flow[i+1];if(r.status==='已完成'&&!records.warehouse.some(v=>v.source===id))records.warehouse.push({id:'LOT-DEMO-'+(++counter),name:r.name,market:r.market,order:r.order,qty:r.qty,status:'待检验',location:'待检区',unit:'件',source:id});}else{let flow=['待检验','已检验','已入库','已出库'];let i=flow.indexOf(r.status);if(i<0||i===flow.length-1)return;r.status=flow[i+1];if(r.status==='已出库'){let o=records.orders.find(v=>v.id===r.order);let shipped=records.warehouse.filter(v=>v.order===r.order&&v.status==='已出库'&&!v.source?.startsWith('PO')).reduce((n,v)=>n+v.qty,0);if(o)o.status=shipped>=o.qty?'已发货':'部分发货';}}closeModal();render();toast('演示节点已更新，关联记录已保留')}
function createProduction(id){let r=records.orders.find(v=>v.id===id);if(!r||r.status!=='待生产')return;if(!records.procurement.some(v=>v.order===id&&v.id.startsWith('MO')))records.procurement.push({id:'MO-DEMO-'+(++counter),name:r.name+' · 生产任务',market:r.market,order:r.id,qty:r.qty,status:'待开工',owner:'演示生产组',due:r.due});r.status='生产中';closeModal();state.page='procurement';state.detail=null;render();toast('已生成关联生产任务')}
function convertModal(s){if(!s||s.status!=='confirmed')return toast('请先选择客户已确认的样品');state.detail=s.id;openModal('从确认样品创建大货',`<div class="note" style="margin-bottom:20px">关联 ${s.id} · 第${s.round}轮 · ${esc(s.versions.at(-1).code)}。保存该版本快照。</div><div class="form-grid">${field('数量（件）','qty','number',1000)}${field('订单总金额','total','number',18000)}${selectfield('币种','currency',s.market==='domestic'?['CNY','USD']:['USD','CNY'])}${field('要求交期','due','date','2026-10-15')}</div>`,'orderForm','<button class="btn primary" type="submit">创建演示订单</button>')}
function paymentModal(id){let o=records.orders.find(v=>v.id===id);if(!o||o.paid>=o.total)return;openModal('登记模拟回款',`<input type="hidden" name="order" value="${id}"><div class="note" style="margin-bottom:18px">${id} · 待收 ${money(o.total-o.paid,o.currency)}，此处不会发起真实付款。</div><div class="form-grid">${field('回款金额（'+o.currency+'）','amount','number',o.total-o.paid)}${field('说明 / 凭证备注','note','text','演示回款记录')}</div>`,'paymentForm','<button class="btn primary" type="submit">保存模拟回款</button>')}
function exportList(){let lines=[['单号','产品','客户','业务板块','轮次','状态','业务员','交期'],...list().map(s=>[s.id,s.name,s.client,state.market==='domestic'?'国内':'国外',s.round,labels[s.status],s.owner,s.due])];let csv='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='源泽-演示样品列表.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('已导出当前业务板块的演示列表')}
const routes={...Object.fromEntries(nav.map(n=>[n[0],n[0]]))};
function go(page){state.page=routes[page]||'samples';state.detail=null;state.query='';state.filter='all';document.body.classList.remove('menu-open');history.replaceState(null,'','#'+state.page);render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{let el;if((el=e.target.closest('[data-market]'))){state.market=el.dataset.market;state.detail=null;state.query='';state.filter='all';render()}else if((el=e.target.closest('[data-page]')))go(el.dataset.page);else if((el=e.target.closest('[data-open]')))openSample(el.dataset.open);else if(e.target.closest('[data-back]'))go('samples');else if(e.target.closest('[data-close]'))closeModal();else if((el=e.target.closest('[data-step]')))stepModal(el.dataset.step);else if((el=e.target.closest('[data-role]'))){state.role=el.dataset.role;render();toast('已切换演示岗位')}else if((el=e.target.closest('[data-formula]')))formulaModal(el.dataset.formula);else if((el=e.target.closest('[data-record]')))recordModal(...el.dataset.record.split(':'));else if((el=e.target.closest('[data-progress]')))progressRecord(...el.dataset.progress.split(':'));else if((el=e.target.closest('[data-create-task]')))createProduction(el.dataset.createTask);else if((el=e.target.closest('[data-payment]')))paymentModal(el.dataset.payment);else if(e.target.closest('#mobileMenu'))document.body.classList.toggle('menu-open');else if(e.target.closest('#aboutButton'))about();else if((el=e.target.closest('[data-action]'))){let a=el.dataset.action;if(a==='new')newSample();if(a==='about')about();if(a==='export')exportList();if(a==='convert')convertModal(current());if(a==='choose-confirmed'){let ss=list().filter(v=>v.status==='confirmed');openModal('选择已确认样品',ss.length?ss.map(s=>`<div class="compact-row"><div class="grow">${esc(s.name)}<div class="cell-sub">${s.id} · 第${s.round}轮</div></div><button class="link-btn" data-pick-order="${s.id}">选择</button></div>`).join(''):'<div class="empty">当前板块暂无已确认样品，请先完成客户确认。</div>')}if(a==='reset')openModal('重置演示数据','<p>本次新增与调整记录将清除，恢复初始虚构样例。</p>','','<button type="button" class="btn danger" data-reset-confirm>确认重置</button>');}else if((el=e.target.closest('[data-pick-order]')))convertModal(samples.find(s=>s.id===el.dataset.pickOrder));else if(e.target.closest('[data-reset-confirm]')){samples=structuredClone(initialSamples);records=structuredClone(initialRecords);payments=[];counter=20;state.detail=null;closeModal();render();toast('已恢复初始演示数据')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;document.getElementById('sampleRows').innerHTML=tableRows()}});
document.addEventListener('change',e=>{if(e.target.id==='statusFilter'){state.filter=e.target.value;document.getElementById('sampleRows').innerHTML=tableRows()}if(e.target.id==='role'){state.role=e.target.value;render()}});
document.addEventListener('submit',e=>{if(!['newForm','stepForm','orderForm','paymentForm'].includes(e.target.id))return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(e.target.id==='newForm'){if(!f.name.trim()||!f.client.trim()||!f.req.trim())return toast('请完整填写客户、产品和需求');if(['来样仿样','配方调整','已有配方复样'].includes(f.type)&&!f.base.trim())return toast('该类型需要填写参考样或基础配方编号');const id='DY2609'+String(++counter).padStart(3,'0');let s={id,name:f.name.trim(),client:f.client.trim()+' · 本次演示',market:state.market,status:e.submitter?.value==='draft'?'draft':'pending',round:1,type:f.type,owner:f.owner.trim(),req:f.req.trim(),due:f.due,short:f.name.trim()[0],quantity:+f.quantity,fill:+f.fill,retained:+f.retained,container:f.container,cost:f.cost,baseFormula:f.base,versions:[{round:1,code:'待实验室确认',req:f.req.trim(),note:f.base?'参考依据：'+f.base:'新需求，等待实验室接单。'}],history:[{title:e.submitter?.value==='draft'?'保存草稿':'提交样品需求',note:f.req.trim(),round:1,time:new Date().toLocaleString('zh-CN')}]};samples.unshift(s);closeModal();openSample(id);toast(s.status==='draft'?'已保存本次页面内的演示草稿':'已提交演示需求，等待实验室接单')}if(e.target.id==='stepForm')performStep(f.action,f);if(e.target.id==='orderForm'){let s=current();if(!s||s.status!=='confirmed')return toast('样品需要客户确认后才能关联大货');if(+f.qty<1||+f.total<1)return toast('请填写有效数量及金额');let o={id:'SO-DEMO-'+(++counter),name:s.name,client:s.client.split(' · ')[0],market:s.market,qty:+f.qty,total:+f.total,paid:0,status:'待生产',sample:s.id,formula:s.versions.at(-1).code,due:f.due,currency:f.currency};records.orders.unshift(o);closeModal();go('orders');toast('演示大货订单已创建，确认版本已固定')}if(e.target.id==='paymentForm'){let o=records.orders.find(v=>v.id===f.order);let n=+f.amount;if(!o||!Number.isFinite(n)||n<=0||n>o.total-o.paid)return toast('金额必须大于零，且不超过待收余额');o.paid=Math.round((o.paid+n)*100)/100;payments.push({order:o.id,amount:n,currency:o.currency,note:f.note});closeModal();render();toast('已登记模拟回款，余额已更新')}});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
state.page=routes[location.hash.slice(1)]||'samples';render();
if(document.modelContext?.registerTool){const life=new AbortController();window.addEventListener('pagehide',()=>life.abort(),{once:true});const tools=[{name:'list_demo_samples',title:'查看演示样品',description:'读取当前业务板块的虚构样品列表，不修改数据。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute(input){if(!input||Object.keys(input).length)throw Error('输入应为空对象');return list().map(s=>({id:s.id,name:s.name,status:labels[s.status],round:s.round}))}},{name:'open_demo_sample',title:'打开演示样品详情',description:'导航至指定演示样品详情，不修改业务记录。',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input.id!=='string'||Object.keys(input).some(k=>k!=='id')||!samples.some(s=>s.id===input.id))throw Error('不存在的演示样品');openSample(input.id);return {opened:input.id}}}];for(const tool of tools){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:life.signal})).catch(()=>{});}catch{}}}
</script></body></html>
